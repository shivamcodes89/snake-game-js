<svg width="1600" height="900" viewBox="0 0 1600 900" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="35%" r="80%">
      <stop offset="0%" stop-color="#161616"/>
      <stop offset="100%" stop-color="#090909"/>
    </radialGradient>

    <!-- nicer cartoon snake: thicker body, tapered tail, rounder head -->
    <g id="snake">
      <path d="M2 30 C 10 8, 26 8, 34 22 C 42 36, 58 36, 66 22 C 72 12, 84 12, 92 18"
            fill="none" stroke="#4ade80" stroke-width="11" stroke-linecap="round"/>
      <path d="M2 30 C -2 30, -4 26, -4 30" fill="none" stroke="#4ade80" stroke-width="5" stroke-linecap="round"/>
      <ellipse cx="98" cy="17" rx="10" ry="9" fill="#4ade80"/>
      <path d="M107 17 L116 17 M116 17 L120 13 M116 17 L120 21" stroke="#f87171" stroke-width="2" stroke-linecap="round" fill="none"/>
      <circle cx="100" cy="14" r="1.8" fill="#0a0a0a"/>
      <circle cx="20" cy="20" r="1.6" fill="#0a0a0a" opacity="0.6"/>
      <circle cx="50" cy="30" r="1.6" fill="#0a0a0a" opacity="0.6"/>
      <circle cx="80" cy="16" r="1.6" fill="#0a0a0a" opacity="0.6"/>
    </g>
  </defs>

  <rect width="1600" height="900" fill="url(#bgGrad)"/>

  <!-- back layer: bigger, softer, sparser, wildly varied angles -->
  <g opacity="0.09">
    <use href="#snake" x="120"  y="60"  transform="rotate(35 165 80) scale(1.4)"/>
    <use href="#snake" x="760"  y="30"  transform="rotate(-70 805 60) scale(1.3)"/>
    <use href="#snake" x="1280" y="90"  transform="rotate(120 1325 110) scale(1.2)"/>
    <use href="#snake" x="50"   y="470" transform="rotate(-100 105 500) scale(1.3)"/>
    <use href="#snake" x="900"  y="510" transform="rotate(60 945 540) scale(1.4)"/>
    <use href="#snake" x="1370" y="460" transform="rotate(-30 1425 490) scale(1.2)"/>
  </g>

  <!-- front layer: smaller, denser, main texture, every snake a different direction -->
  <g opacity="0.12">
    <use href="#snake" x="40"   y="190" transform="rotate(-40 85 210) scale(0.85)"/>
    <use href="#snake" x="340"  y="220" transform="rotate(160 385 250) scale(0.9)"/>
    <use href="#snake" x="620"  y="160" transform="rotate(75 665 190) scale(0.8)"/>
    <use href="#snake" x="920"  y="220" transform="rotate(-110 965 240) scale(0.95)"/>
    <use href="#snake" x="1200" y="170" transform="rotate(25 1245 200) scale(0.85)"/>
    <use href="#snake" x="1470" y="230" transform="rotate(-160 1525 260) scale(0.8)"/>

    <use href="#snake" x="180"  y="350" transform="rotate(90 225 380) scale(0.9)"/>
    <use href="#snake" x="500"  y="400" transform="rotate(-55 545 420) scale(0.85)"/>
    <use href="#snake" x="800"  y="340" transform="rotate(140 845 370) scale(0.95)"/>
    <use href="#snake" x="1100" y="410" transform="rotate(-15 1145 430) scale(0.8)"/>
    <use href="#snake" x="1400" y="350" transform="rotate(100 1445 380) scale(0.9)"/>

    <use href="#snake" x="80"   y="600" transform="rotate(-80 125 630) scale(0.9)"/>
    <use href="#snake" x="380"  y="650" transform="rotate(45 425 670) scale(0.8)"/>
    <use href="#snake" x="680"  y="590" transform="rotate(-130 725 620) scale(0.9)"/>
    <use href="#snake" x="980"  y="660" transform="rotate(170 1025 680) scale(0.85)"/>
    <use href="#snake" x="1280" y="600" transform="rotate(-20 1325 630) scale(0.95)"/>
    <use href="#snake" x="1520" y="670" transform="rotate(65 1565 690) scale(0.8)"/>

    <use href="#snake" x="220"  y="780" transform="rotate(-95 265 810) scale(0.85)"/>
    <use href="#snake" x="560"  y="830" transform="rotate(30 605 850) scale(0.9)"/>
    <use href="#snake" x="900"  y="780" transform="rotate(-150 945 810) scale(0.8)"/>
    <use href="#snake" x="1220" y="840" transform="rotate(80 1265 860) scale(0.9)"/>
  </g>
</svg>
