<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Snake Game</title>
  <link rel="stylesheet" href="./style.css">
</head>
<body>
  <main>
    <section>
      
      <div class="topbar">
        <div class="logo">
          <span aria-hidden="true">🐍</span> SnakeCraft
        </div>
        <p class="controls-hint">Use arrow keys or WASD to move</p>
      </div>

      <div class="infos">
        <div class="info">
          <h3>High Score:
            <span id="high-score">0</span>
          </h3>
        </div>
        <div class="info">
          <h3>Score:
            <span id="score">0</span>
          </h3>
        </div>
        <div class="info">
          <h3>Time:
            <span id="time">00:00</span>
          </h3>
        </div>
      </div>

      <div class="board"></div>
    </section>
    <div class="modal" role="dialog" aria-modal="true" aria-label="Snake game">
      <div class="modal-card start-game">
        <span class="modal-emoji" aria-hidden="true">🐍</span>
        <p class="eyebrow">READY, SET, SLITHER</p>
        <h1>SnakeCraft</h1>
        <p class="modal-copy">Eat the glowing fruit, grow longer, and avoid the walls.</p>
        <button class="btn btn-start">Start Game</button>
      </div>
      <div class="modal-card game-over">
        <span class="modal-emoji" aria-hidden="true">💥</span>
        <p class="eyebrow">NICE RUN</p>
        <h1>Game over</h1>
        <p class="modal-copy">Final score: <strong id="final-score">0</strong></p>
        <button class="btn btn-restart">Restart Game</button>
      </div> 
    </div>
  </main>
  <script src="script.js"></script>
</body>
</html>
